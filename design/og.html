<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; background: #1a1d24; color: #f1f5f9; font-family: "Space Grotesk", sans-serif; overflow: hidden; }
.page { display: grid; grid-template-columns: 1fr 420px; gap: 64px; align-items: center; height: 100%; padding: 64px 72px; }
.brand { display: flex; align-items: center; gap: 16px; font-size: 40px; font-weight: 600; letter-spacing: -0.8px; }
.brand svg { width: 60px; height: 60px; }
h1 { font-size: 54px; line-height: 1.08; letter-spacing: -1.6px; margin: 44px 0 28px; font-weight: 700; }
.tag { font: 600 22px "JetBrains Mono", monospace; color: #22d3ee; }
.card { background: #1f2229; border: 1px solid rgba(255,255,255,.08); border-radius: 18px; overflow: hidden; }
.provider { border-color: #22d3ee; }
.head { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 22px; font-weight: 600; }
.chip { font-size: 15px; color: #22d3ee; background: rgba(34,211,238,.12); padding: 4px 10px; border-radius: 7px; }
.row { display: flex; gap: 14px; padding: 12px 22px; font: 18px "JetBrains Mono", monospace; }
.row .c { color: #22d3ee; }
.row .v { color: #94a3b8; }
.cord { position: relative; height: 84px; display: grid; place-items: center; }
.cord::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #22d3ee; }
.label { position: relative; padding: 7px 16px; border-radius: 999px; background: #1a1d24; border: 1.5px solid #22d3ee; color: #22d3ee; font: 16px "JetBrains Mono", monospace; }
.f { display: flex; align-items: center; gap: 12px; padding: 13px 22px; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 19px; font-weight: 500; }
.f:last-child { border-bottom: 0; }
.f svg { width: 20px; height: 20px; flex: none; }
</style>
</head>
